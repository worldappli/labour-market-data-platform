services:
  postgres:
    image: postgres:16
    container_name: datawarehouse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DW_DATABASE}
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data

volumes:
  postgres_data:

